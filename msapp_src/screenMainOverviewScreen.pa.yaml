Screens:
  MainOverviewScreen:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =varSky
      OnVisible: |-
        =Set(
            varOpenShift,
            LookUp(DailyShifts, ShiftDate = Today() && ShiftType.Value = "Open")
        );
        Set(
            varCloseShift,
            LookUp(DailyShifts, ShiftDate = Today() && ShiftType.Value = "Close")
        )
    Children:
      - contPage:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            Height: =App.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =20
            Width: =App.Width
          Children:
            - contHeader:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.Semilight
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMaxHeight: =75
                  LayoutMinHeight: =75
                  Width: =App.Width
                Children:
                  - contHeaderLeft:
                      Control: GroupContainer@1.4.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Height: =75
                        LayoutMaxWidth: =280
                        LayoutMinHeight: =75
                        Width: =App.Width
                      Children:
                        - logo:
                            Control: Image@2.2.3
                            Properties:
                              Height: =47
                              Image: ='app-icon-ball-checkout'
                              Width: =47
                              X: =15
                              Y: =15
                        - lblPageTitle:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =varSky
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              PaddingLeft: =0
                              PaddingRight: =0
                              Size: =14
                              Text: ="Main Overview"
                              Width: =180
                              X: =80
                              Y: =21
                  - contHeaderRight:
                      Control: GroupContainer@1.4.0
                      Variant: ManualLayout
                      Properties:
                        Height: =75
                        LayoutMaxWidth: =170
                        LayoutMinHeight: =75
                        PaddingRight: =20
                        Width: =App.Width
                      Children:
                        - lblDate:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              AutoHeight: =true
                              Color: =varForest300
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Size: =12
                              Text: =Text(Today(), "ddd, mmm d")
                              Width: =Parent.Width-20
                              X: =contHeaderRight.Width-Self.Width-20
                              Y: =contHeaderRight.Height/2-10
            - contShifts:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =20
                  PaddingLeft: =40
                  PaddingRight: =40
                  Width: =App.Width
                Children:
                  - contOpen:
                      Control: GroupContainer@1.4.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Semilight
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =20
                        RadiusBottomLeft: =20
                        RadiusBottomRight: =20
                        RadiusTopLeft: =20
                        RadiusTopRight: =20
                      Children:
                        - lblOpenTitle:
                            Control: Label@2.5.1
                            Properties:
                              Color: =varSky
                              FontWeight: =FontWeight.Semibold
                              Size: =14
                              Text: ="Opening Shift"
                        - lblOpenEmployee:
                            Control: Label@2.5.1
                            Properties:
                              Text: =If(IsBlank(varOpenShift), "No opening shift", varOpenShift.Employee.EmployeeName)
                        - lblOpenTimes:
                            Control: Label@2.5.1
                            Properties:
                              Text: =If(IsBlank(varOpenShift), "", "Start: " & Text(varOpenShift.StartTime, "hh:mm am/pm") & "  End: " & Text(varOpenShift.EndTime, "hh:mm am/pm"))
                        - lblOpenStatus:
                            Control: Label@2.5.1
                            Properties:
                              Text: =If(IsBlank(varOpenShift), "", "Status: " & varOpenShift.Status.Value)
                  - contClose:
                      Control: GroupContainer@1.4.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Semilight
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =20
                        RadiusBottomLeft: =20
                        RadiusBottomRight: =20
                        RadiusTopLeft: =20
                        RadiusTopRight: =20
                      Children:
                        - lblCloseTitle:
                            Control: Label@2.5.1
                            Properties:
                              Color: =varSky
                              FontWeight: =FontWeight.Semibold
                              Size: =14
                              Text: ="Closing Shift"
                        - lblCloseEmployee:
                            Control: Label@2.5.1
                            Properties:
                              Text: =If(IsBlank(varCloseShift), "No closing shift", varCloseShift.Employee.EmployeeName)
                        - lblCloseTimes:
                            Control: Label@2.5.1
                            Properties:
                              Text: =If(IsBlank(varCloseShift), "", "Start: " & Text(varCloseShift.StartTime, "hh:mm am/pm") & "  End: " & Text(varCloseShift.EndTime, "hh:mm am/pm"))
                        - lblCloseStatus:
                            Control: Label@2.5.1
                            Properties:
                              Text: =If(IsBlank(varCloseShift), "", "Status: " & varCloseShift.Status.Value)
            - contFooter:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutGap: =20
                  PaddingRight: =40
                  Width: =App.Width
                Children:
                  - btnNewShift:
                      Control: FluentV8/Button@1.5.13
                      Properties:
                        Alignment: =Align.Center
                        BorderRadius: =100
                        ButtonType: ='Button.ButtonType'.Primary
                        FillColor: =varForest
                        FontSize: =11
                        Height: =44
                        HoverFillColor: =varForest
                        OnSelect: =Navigate(StartShiftScreen, ScreenTransition.Cover)
                        Text: ="Start New Shift"
                        Width: =160
